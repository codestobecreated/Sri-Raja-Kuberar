<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple – Sri Navapasana Raja Murugan</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5e1712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body class="font-sans">
<div id="site-header"></div>
<main id="page"></main>
<div id="site-footer"></div>
<script>
const TP = TEMPLES.find(x => x.id === qs('id')) || TEMPLES[0];
document.title = TP.name + ' – Sri Navapasana Raja Murugan';
const tour = [TP.img, ...IMG.gallery, ...IMG.hero];
$('#page').innerHTML = `${pageHero(esc(L(TP)), '📍 ' + esc(TP.city) + ' · Presiding deity: ' + esc(TP.deity), [[t('temples'), 'temples.html'], [L(TP)]])}
<section class="max-w-7xl mx-auto px-4 py-10 grid lg:grid-cols-3 gap-8">
  <div class="lg:col-span-2 space-y-8">
    <div class="card overflow-hidden"><div class="flex items-center justify-between px-5 py-3 border-b"><b class="text-temple-900">🔄 360° Virtual Tour</b><span class="text-xs text-gray-500">Drag or use arrows to look around</span></div>
      <div id="tour" class="relative h-80 md:h-[26rem] overflow-hidden cursor-grab select-none bg-black"><div id="pano" class="absolute inset-y-0 left-0 flex h-full">${tour.concat(tour).map(s => `<img src="${s}" class="h-full w-auto max-w-none object-cover" draggable="false" alt="" onerror="this.remove()">`).join('')}</div>
        <button id="tl" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90" aria-label="Left">◀</button><button id="tr" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90" aria-label="Right">▶</button></div></div>
    <div class="card p-6"><h2 class="font-display text-2xl text-temple-900">Temple history & Sthala Puranam</h2><p class="mt-3 text-gray-700 leading-relaxed">${esc(TP.history)}</p><a href="articles.html" class="inline-block mt-3 text-temple-700 font-semibold">Read more articles →</a></div>
    <div><h2 class="font-display text-2xl text-temple-900 mb-4">Poojas at this temple</h2><div class="grid sm:grid-cols-2 gap-6">${POOJAS.filter(p => p.temple === TP.id).map(poojaCard).join('') || '<p class="text-gray-600">Coming soon.</p>'}</div></div>
  </div>
  <aside class="space-y-6">
    <div class="card p-6"><h3 class="font-bold text-temple-900">📜 Authorization letter</h3><div class="mt-3 border-4 border-double border-gold-400 rounded-xl p-4 bg-gold-50 text-xs text-gray-700">
      <p class="font-display text-center text-temple-900 text-base">${esc(TP.name)}</p><p class="mt-2">This is to certify that <b>${esc(SITE.name)}</b> is authorised to accept online bookings and deliver prasadam on behalf of the temple.</p>
      <p class="mt-3 text-right">— Executive Officer</p></div><p class="text-[11px] text-gray-500 mt-2">Proof that this is a genuine, temple-approved website.</p></div>
    <div class="card p-6"><h3 class="font-bold text-temple-900 mb-4">🧘 Our priests</h3><div class="space-y-4">${PRIESTS.map(p => `<div class="flex items-center gap-3">${imgTag(p.img, 'w-14 h-14 rounded-xl object-cover bg-temple-50', p.name)}<div><b class="text-sm text-temple-900">${esc(p.name)}</b><p class="text-xs text-gray-500">${p.exp} yrs · ${esc(p.spec)}</p></div></div>`).join('')}</div></div>
    <div class="card p-6"><h3 class="font-bold text-temple-900">🕰 Temple timings</h3><ul class="text-sm mt-2 space-y-1 text-gray-700"><li>Morning: 6:00 AM – 12:30 PM</li><li>Evening: 4:00 PM – 9:00 PM</li><li>Annadhanam: 12:00 PM daily</li></ul>
      <div class="flex gap-2 mt-4"><a href="darshan.html" class="btn btn-gold text-sm !py-2 flex-1">Book darshan</a><a href="${SITE.mapUrl}" target="_blank" rel="noopener" class="btn btn-outline text-sm !py-2">🗺 Map</a></div></div>
  </aside>
</section>`;
// 360 tour: drag / auto-pan
let x = 0, drag = false, sx = 0; const pano = $('#pano'), wrap = $('#tour');
const clamp = () => { const half = pano.scrollWidth / 2; if (x <= -half) x += half; if (x > 0) x -= half; pano.style.transform = `translateX(${x}px)`; };
wrap.onpointerdown = e => { if (e.target.closest('button')) return; drag = true; sx = e.clientX; wrap.setPointerCapture(e.pointerId); };
wrap.onpointermove = e => { if (!drag) return; x += e.clientX - sx; sx = e.clientX; clamp(); };
wrap.onpointerup = () => drag = false;
$('#tl').onclick = e => { e.stopPropagation(); x += 300; clamp(); }; $('#tr').onclick = e => { e.stopPropagation(); x -= 300; clamp(); };
setInterval(() => { if (!drag) { x -= 0.4; clamp(); } }, 16);
</script>
</body>
</html>
