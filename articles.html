<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">

<script>
$('#hero').innerHTML = pageHero('Articles', 'Temple history, sthala puranam and the meaning behind our rituals.', [['Articles']]);
$('#list').innerHTML = ARTICLES.map((a, i) => `<a href="article.html?id=${a.id}" class="card overflow-hidden group hover:shadow-soft transition ${i === 0 ? 'md:col-span-2 lg:col-span-2' : ''}">
  <div class="${i === 0 ? 'aspect-[21/9]' : 'aspect-[16/10]'} overflow-hidden">${imgTag(a.img, 'w-full h-full object-cover group-hover:scale-105 transition duration-500', a.title)}</div>
  <div class="p-5"><p class="text-xs text-gray-500">${fmtDate(a.date)} · ${a.read} min read</p><h2 class="font-display text-2xl text-temple-900 mt-1">${esc(lang === 'ta' ? a.ta : a.title)}</h2><p class="text-sm text-gray-600 mt-2 line-clamp-2">${esc(a.excerpt)}</p><span class="inline-block mt-3 text-temple-700 font-semibold text-sm">Read article →</span></div></a>`).join('');
</script>
