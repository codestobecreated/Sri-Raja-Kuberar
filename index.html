      <p class="mt-4 text-stone-200 max-w-xl">Subscribe once – archana is performed automatically on every special day in your family's name, with a reminder and live link the day before.</p></div>
    <div class="relative lg:col-span-2 flex flex-wrap lg:justify-end gap-3"><a href="subscriptions.html" class="btn btn-gold !px-7 !py-3.5">See plans from ₹151/month</a><a href="membership.html" class="btn btn-ghost !py-3.5">Become a member</a></div>
  </div>
</section>
`;

// ---------- Countdown ----------
function tickCountdown() {
  const target = new Date(NEXT.date + 'T' + (/(\d+):(\d+)\s*(AM|PM)/i.test(NEXT.time) ? (() => { let [, h, m, ap] = NEXT.time.match(/(\d+):(\d+)\s*(AM|PM)/i); h = (+h % 12) + (ap.toUpperCase() === 'PM' ? 12 : 0); return String(h).padStart(2, '0') + ':' + m; })() : '06:00') + ':00');
  let s = Math.max(0, Math.floor((target - new Date()) / 1000));
  const parts = [[Math.floor(s / 86400), 'Days'], [Math.floor(s % 86400 / 3600), 'Hrs'], [Math.floor(s % 3600 / 60), 'Min'], [s % 60, 'Sec']];
  $('#countdown').innerHTML = parts.map(p => `<div class="rounded-xl bg-white/5 border border-white/10 py-2"><b class="block font-display text-3xl text-gold-200 leading-none">${String(p[0]).padStart(2, '0')}</b><span class="text-[10px] uppercase tracking-widest text-stone-400">${p[1]}</span></div>`).join('');
}
tickCountdown(); setInterval(tickCountdown, 1000);

// ---------- Featured poojas with category tabs ----------
const CATS = [['', 'All'], ['pooja', 'Pooja & Homam'], ['aarti', 'Aarti'], ['virtual', 'Virtual Seva'], ['darshan', 'Darshan']];
let cat = '';
function drawPoojas() {
  $('#ptabs').innerHTML = CATS.map(c => `<button data-c="${c[0]}" class="px-5 py-2 rounded-full text-sm font-semibold border transition ${c[0] === cat ? 'bg-temple-700 text-white border-temple-700' : 'bg-white border-sandal text-stone-700 hover:border-gold-400'}">${c[1]}</button>`).join('');
  $$('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; drawPoojas(); });
  const list = [...POOJAS].filter(p => !cat || p.category === cat).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);
  $('#featured').innerHTML = list.map(poojaCard).join('') || '<p class="col-span-full text-center text-stone-500">Coming soon.</p>';
}
drawPoojas();

// ---------- Special days ----------
$('#days').innerHTML = SPECIAL_DAYS.filter(d => d.date >= today).slice(0, 8).map(d => {
  const dt = new Date(d.date + 'T00:00:00'), p = POOJAS.find(x => x.id === d.pooja);
  return `<div class="snap-start shrink-0 w-64 rounded-[1.6rem] bg-white border border-sandal p-5 hover:shadow-soft transition flex flex-col">
    <div class="flex items-center gap-4"><div class="w-16 h-[4.5rem] rounded-t-full rounded-b-xl bg-temple-700 text-center pt-3"><b class="block font-display text-3xl leading-none text-gold-200">${dt.getDate()}</b><span class="text-[10px] font-bold uppercase tracking-wider text-gold-300">${dt.toLocaleDateString('en', { month: 'short' })}</span></div>
      <div><b class="font-display text-2xl text-temple-900 leading-tight">${d.type}</b><p class="font-tamil text-sm text-gold-700">${d.ta}</p><p class="text-xs text-stone-500">${dt.toLocaleDateString('en-IN', { weekday: 'long' })}</p></div></div>
    <p class="text-sm text-stone-600 mt-4 flex-1">${esc(p.name)}</p>
    <a href="pooja.html?id=${d.pooja}&date=${d.date}" class="btn btn-outline text-sm !py-2 mt-4">Book for this day</a></div>`;
}).join('');

// ---------- Donations ----------
// Donation causes: one featured (Annadhanam) + compact list. Images are absolutely positioned so every photo crops to the same frame.
const DON_ICON = { annadhanam: 'leaf', bricks: 'temple', goshala: 'sun', education: 'scroll' };
const pct = d => Math.round(d.raised / d.goal * 100);
const progress = (d, dark) => `<div class="h-2 rounded-full ${dark ? 'bg-white/15' : 'bg-sandal'} overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-gold-300 to-gold-500" style="width:${Math.max(pct(d), 3)}%"></div></div>
  <div class="flex justify-between text-xs mt-2 ${dark ? 'text-stone-300' : 'text-stone-500'}"><span><b class="${dark ? 'text-gold-200' : 'text-temple-800'} text-sm">${rupee(d.raised)}</b> raised</span><span>${pct(d)}% of ${rupee(d.goal)}</span></div>`;
const [feat, ...rest] = DONATIONS;
$('#donations').innerHTML = `
  <article class="lg:col-span-2 relative rounded-[2rem] overflow-hidden min-h-[30rem] text-white flex reveal">
    ${imgTag(feat.img, 'absolute inset-0 w-full h-full object-cover', feat.name)}
    <div class="absolute inset-0 bg-gradient-to-t from-night-950 via-night-950/75 to-night-950/10"></div>
    <div class="relative mt-auto p-7 md:p-8 w-full">
      <span class="chip bg-gold-400 text-night-950">${ic('sparkle', 'w-3.5 h-3.5')} Most needed</span>
      <h3 class="font-display text-4xl font-semibold mt-4 leading-tight">${esc(feat.name)}</h3><p class="font-tamil text-lg text-gold-200">${feat.ta}</p>
      <p class="text-stone-300 mt-2">${esc(feat.desc)} ₹501 feeds 10 devotees.</p>
      <div class="mt-6">${progress(feat, true)}</div>
      <div class="grid grid-cols-3 gap-2 mt-6">${[501, 1001, 2501].map(a => `<a href="donate.html?cause=${feat.id}&amount=${a}" class="rounded-xl border border-white/25 py-2.5 text-center font-bold hover:bg-white/10 hover:border-gold-300 transition">${rupee(a)}</a>`).join('')}</div>
      <a href="donate.html?cause=${feat.id}" class="btn btn-gold w-full mt-3 !py-3">Donate to Annadhanam ${ic('arrow', 'w-4 h-4')}</a>
    </div>
  </article>
  <div class="lg:col-span-3 grid gap-5">
    ${rest.map((d, i) => `<article class="reveal group grid grid-cols-[7.5rem_1fr] sm:grid-cols-[11rem_1fr] rounded-[1.6rem] bg-white border border-sandal overflow-hidden hover:shadow-soft transition" style="transition-delay:${(i + 1) * 90}ms">
      <div class="relative overflow-hidden">${imgTag(d.img, 'absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-700', d.name)}</div>
      <div class="p-5 sm:p-6 flex flex-col">
        <div class="flex items-start justify-between gap-3">
          <div><b class="font-display text-2xl text-temple-900 leading-tight block">${esc(d.name)}</b><span class="font-tamil text-sm text-gold-700">${d.ta}</span></div>
          <span class="hidden sm:grid w-10 h-10 shrink-0 rounded-xl bg-temple-50 text-temple-700 place-items-center">${ic(DON_ICON[d.id] || 'heart', 'w-5 h-5')}</span>
        </div>
        <p class="text-sm text-stone-600 mt-1.5 line-clamp-2">${esc(d.desc)}</p>
        <div class="mt-4">${progress(d)}</div>
        <div class="flex items-center gap-2 mt-4">
          <a href="donate.html?cause=${d.id}" class="btn btn-green text-sm !py-2 !px-5">Donate</a>
          <a href="donate.html?cause=${d.id}&amount=1001" class="text-sm font-semibold text-temple-700 hover:underline">Give ₹1,001</a>
        </div>
      </div></article>`).join('')}
  </div>`;

// ---------- Products ----------
$('#products').innerHTML = PRODUCTS.slice(0, 4).map((p, i) => `<a href="product.html?id=${p.id}" class="group reveal" style="transition-delay:${i * 80}ms">
  <div class="relative rounded-[1.6rem] overflow-hidden aspect-square bg-white border border-sandal p-4">${imgTag(p.img, 'w-full h-full object-contain group-hover:scale-105 transition duration-700', p.name)}
    <span class="absolute top-3 left-3 chip bg-temple-700 text-white">-${Math.round((1 - p.price / p.mrp) * 100)}%</span>
    <span class="absolute bottom-3 right-3 w-10 h-10 rounded-full bg-ivory text-temple-800 grid place-items-center opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition">${ic('cart', 'w-4 h-4')}</span></div>
  <p class="text-[11px] uppercase tracking-[.18em] text-gold-700 font-bold mt-4">${p.cat}</p>
  <b class="font-display text-xl text-temple-900 leading-tight block mt-1">${esc(L(p, 'name', 'ta'))}</b>
  <p class="mt-1 font-bold text-temple-800">${rupee(p.price)} <s class="text-xs text-stone-400 font-normal">${rupee(p.mrp)}</s></p></a>`).join('');

$('#reviews').innerHTML = REVIEWS.slice(0, 3).map(r => `<div class="reveal">${reviewCard(r)}</div>`).join('');

$('#remind').onclick = async () => {
  if (!('Notification' in window)) return toast('Notifications are not supported on this browser');
  const p = await Notification.requestPermission();
  toast(p === 'granted' ? '🔔 You will be notified before every live stream' : 'Notifications are blocked in browser settings');
};

// ---------- Scroll reveal ----------
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 }) : null;
$$('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
</body>
</html>
