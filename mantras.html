<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantras & Slokas – Sri Navapasana Raja Murugan</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5e1712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body class="font-sans">
<div id="site-header"></div>
<main><div id="hero"></div><section class="max-w-4xl mx-auto px-4 py-10 space-y-5" id="list"></section></main>
<div id="site-footer"></div>
<script>
$('#hero').innerHTML = pageHero('Mantras & Slokas', 'Listen and chant along – with meanings in Tamil.', [[t('panchangam')], ['Mantras']]);
// Each mantra may have an `audio` URL (uploaded in Admin › Content Manager). Without it, the browser's voice reads the mantra.
$('#list').innerHTML = MANTRAS.map((m, i) => `<div class="card p-6"><div class="flex items-start gap-4">
  <button data-play="${i}" class="w-14 h-14 shrink-0 rounded-full bg-temple-700 text-white text-xl grid place-items-center hover:bg-temple-800" aria-label="Play ${esc(m.name)}">▶</button>
  <div class="flex-1"><div class="flex justify-between"><h2 class="font-display text-2xl text-temple-900">${esc(m.name)}</h2><span class="text-xs text-gray-500">${m.dur}</span></div>
  <p class="mt-2 text-lg text-maroon-600 leading-relaxed">${m.text}</p>
  <div class="mt-3 rounded-xl bg-gold-50 p-3"><p class="text-xs font-bold text-gold-700">பொருள் (Meaning)</p><p class="text-temple-900 mt-1">${m.ta}</p></div>
  <div class="mt-3 h-1.5 bg-gray-100 rounded-full"><div class="h-1.5 bg-gold-400 rounded-full w-0 transition-all" id="bar${i}"></div></div></div></div></div>`).join('');
let playing = null;
$$('[data-play]').forEach(b => b.onclick = () => {
  const i = +b.dataset.play, m = MANTRAS[i];
  speechSynthesis.cancel(); $$('[data-play]').forEach(x => x.textContent = '▶'); $$('[id^=bar]').forEach(x => x.style.width = '0');
  if (playing === i) return playing = null;
  playing = i; b.textContent = '⏸';
  if (m.audio) { const a = new Audio(m.audio); a.play(); a.ontimeupdate = () => $('#bar' + i).style.width = (a.currentTime / a.duration * 100) + '%'; a.onended = () => { b.textContent = '▶'; playing = null; }; return; }
  const u = new SpeechSynthesisUtterance(m.text); u.lang = 'hi-IN'; u.rate = .75;
  u.onboundary = e => $('#bar' + i).style.width = (e.charIndex / m.text.length * 100) + '%';
  u.onend = () => { b.textContent = '▶'; $('#bar' + i).style.width = '100%'; playing = null; };
  speechSynthesis.speak(u);
});
</script>
</body>
</html>
