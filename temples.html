<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temples – Sri Navapasana Raja Murugan</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5e1712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body class="font-sans">
<div id="site-header"></div>
<main><div id="hero"></div><section class="max-w-7xl mx-auto px-4 py-12"><div id="list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div></section></main>
<div id="site-footer"></div>
<script>
$('#hero').innerHTML = pageHero(t('temples'), 'Our peedam and partner temples where poojas are performed in your name.', [[t('temples')]]);
$('#list').innerHTML = TEMPLES.map(tp => `<a href="temple.html?id=${tp.id}" class="card overflow-hidden group hover:shadow-soft transition">
  <div class="aspect-[16/10] overflow-hidden">${imgTag(tp.img, 'w-full h-full object-cover group-hover:scale-105 transition duration-500', tp.name)}</div>
  <div class="p-5"><span class="chip bg-gold-100 text-gold-700">📍 ${esc(tp.city)} · ${esc(tp.deity)}</span><h2 class="font-display text-2xl text-temple-900 mt-2">${esc(L(tp))}</h2>
  <p class="text-sm text-gray-600 mt-2 line-clamp-3">${esc(tp.history)}</p>
  <div class="flex justify-between items-center mt-4"><span class="text-sm text-temple-700 font-semibold">${POOJAS.filter(p => p.temple === tp.id).length} poojas available</span><span class="chip bg-temple-50 text-temple-700">📜 Authorised</span></div></div></a>`).join('');
</script>
</body>
</html>
