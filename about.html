<!doctype html>

<link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5e1712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css">

</head>
<body class="font-sans">
<div id="site-header"></div>

<div id="site-footer"></div>
<script>
const TEAM = [['Balaji Panchapakesan', 'President'], ['Cholarani Panchapakesan', 'Vice President'], ['Jayanthi Gunasekaran', 'Administrative Officer'], ['Sujatha', 'General Secretary'], ['Lakshmi Devan', 'Treasurer']];
const PRACTICES = [['🛕', 'Temple', 'Swamigal built a small temple for Raja Kuberar in an apartment in Ashok Nagar, Chennai, and envisioned a grand temple for Om Sri Raja Kuberar.'], ['🪔', 'Pooja', 'Seek the blessings of Raja Kuberar – worshipping him enriches one\'s life.'], ['📚', 'Education', 'Swamigal provides education to poor children through charity and other noble deeds.'], ['🙏', 'Belief', 'God is kind and showers blessings on everyone; those who suffer seek solace here.'], ['🏅', 'Honorary Trustee', 'A great privilege granted only to the immensely blessed.'], ['💬', 'Guidance', 'Healthy discussion on health, family, education, career and remedies for life\'s problems.']];
$('#page').innerHTML = `${pageHero(t('about'), 'Om Sri Raja Kubera Siddhar Peedam – Kuberapattinam, Kanchipuram', [[t('about')]])}
<section class="max-w-7xl mx-auto px-4 py-14 grid lg:grid-cols-2 gap-12 items-center">
  <div class="relative">${imgTag(IMG.about[0], 'rounded-3xl w-full aspect-[4/5] object-cover', 'Swamigal')}<div class="absolute -bottom-6 -right-4 bg-gold-400 text-temple-900 rounded-2xl p-5 shadow-soft max-w-[14rem]"><b class="font-display text-xl">Annam Param Brahmam</b><p class="text-xs">அன்னம் பரம்பிரம்மம்</p></div></div>
  <div><p class="text-gold-700 font-bold text-sm tracking-widest uppercase">About the Swamigal</p><h2 class="font-display text-4xl text-temple-900 mt-1">ThavathiruSivasri Deva Raja Kubera Swamigal</h2>
    <p class="mt-4 text-gray-700 leading-relaxed">Sri Raja Kubera Siddhar, an ardent devotee of Lord Shiva, never missed his girivalam in his early days, and he was blessed by a Siddhar during one of them. Kubera Swamigal, a deeply spiritual person, helps the poor and needy through Annadhanam and provides education to poor children through charity.</p>
    <p class="mt-3 text-gray-700 leading-relaxed">As you walk with the Guru, you walk in the light of existence, away from the darkness of ignorance. Swamiji gives guidance and solutions to overcome the problems of life.</p>
    <div class="grid grid-cols-3 gap-4 mt-8 text-center"><div class="card p-4"><b class="text-2xl text-temple-700 font-display">Daily</b><p class="text-xs text-gray-600">Annadhanam</p></div><div class="card p-4"><b class="text-2xl text-temple-700 font-display">25K+</b><p class="text-xs text-gray-600">Poojas performed</p></div><div class="card p-4"><b class="text-2xl text-temple-700 font-display">100+</b><p class="text-xs text-gray-600">Children supported</p></div></div></div>
</section>
<section class="bg-temple-50 py-14"><div class="max-w-7xl mx-auto px-4"><h2 class="font-display text-4xl text-temple-900 text-center">Our spiritual practices</h2><p class="text-center text-gray-600 mt-2">Gaining divine blessings through sacred rituals</p>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-10">${PRACTICES.map(p => `<div class="card p-6"><div class="text-4xl">${p[0]}</div><b class="block text-lg text-temple-900 mt-3">${p[1]}</b><p class="text-sm text-gray-600 mt-1">${p[2]}</p></div>`).join('')}</div></div></section>
<section class="max-w-7xl mx-auto px-4 py-14"><h2 class="font-display text-4xl text-temple-900 text-center">Our mission</h2>
  <p class="max-w-3xl mx-auto text-center text-gray-700 mt-4 leading-relaxed">To bring the grace of Sri Raja Kuberar to every devotee – wherever they live – through authentic Vedic poojas performed with transparency, to feed the hungry through Annadhanam, and to educate children who cannot afford it.</p>
  <h2 class="font-display text-3xl text-temple-900 text-center mt-16">Meet our devoted temple trustees</h2>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-5 mt-8">${TEAM.map((m, i) => `<div class="text-center">${imgTag(IMG.team[i], 'w-full aspect-square rounded-3xl object-cover bg-temple-50', m[0])}<b class="block mt-3 text-temple-900">${m[0]}</b><p class="text-xs text-gold-700 font-semibold">${m[1]}</p></div>`).join('')}</div>
  <h2 class="font-display text-3xl text-temple-900 text-center mt-16">A glimpse of divine celebrations</h2>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-8">${IMG.gallery.map(s => imgTag(s, 'w-full aspect-square object-cover rounded-2xl')).join('')}</div>
</section>`;
</script>
