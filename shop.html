<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divine Collections – Sri Navapasana Raja Murugan</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#5e1712">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body class="font-sans">
<div id="site-header"></div>
<main><div id="hero"></div>
  <section class="max-w-7xl mx-auto px-4 py-10"><div id="cats" class="flex gap-2 overflow-x-auto no-scrollbar"></div><div id="list" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 mt-6"></div></section></main>
<div id="site-footer"></div>
<script>
$('#hero').innerHTML = pageHero(t('shop'), 'Siddha herbal medicines – lehyam, capsules, oils and choornam by ' + BRAND.name + ', at the temple premises.', [[t('shop')]]);
let cat = '';
function draw() {
  const cats = ['', ...new Set(PRODUCTS.map(p => p.cat))];
  $('#cats').innerHTML = cats.map(c => `<button data-c="${c}" class="chip !text-sm !px-4 !py-2 border border-temple-200 bg-white shrink-0 ${c === cat ? 'tab-active' : ''}">${c || 'All'}</button>`).join('');
  $$('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; draw(); });
  $('#list').innerHTML = PRODUCTS.filter(p => !cat || p.cat === cat).map(p => `<div class="card overflow-hidden flex flex-col relative group">
    <a href="product.html?id=${p.id}" class="block aspect-square bg-white overflow-hidden p-3">${imgTag(p.img, 'w-full h-full object-contain group-hover:scale-105 transition', p.name)}</a>
    <button onclick="this.textContent=wish.toggle('${p.id}')?'❤️':'🤍'" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white shadow" aria-label="Wishlist">${wish.has(p.id) ? '❤️' : '🤍'}</button>
    ${p.stock ? '' : '<span class="chip absolute top-3 left-3 bg-gray-800 text-white">Out of stock</span>'}
    <div class="p-4 flex flex-col flex-1"><p class="text-[11px] text-gold-700 font-bold uppercase">${p.cat}</p><a href="product.html?id=${p.id}" class="font-semibold text-temple-900 text-sm line-clamp-2 mt-1">${esc(L(p, 'name', 'ta'))}</a>
    <p class="mt-2 font-extrabold text-temple-700">${rupee(p.price)} <s class="text-xs text-gray-400 font-normal">${rupee(p.mrp)}</s></p>
    <button ${p.stock ? '' : 'disabled'} onclick="cart.add('${p.id}')" class="btn btn-green text-sm !py-2 mt-auto pt-2 w-full">Add to cart</button></div></div>`).join('');
}
draw();
</script>
</body>
</html>
